# Typecheck, build and a production audit on every pull request and on main, then a deploy from main.
# A run on main is never canceled, so a deploy cannot stop halfway.

name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ci:
    name: Typecheck, build, audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  # Dormant until the repo variable CF_DEPLOY is 'true', so CI stays green before the Cloudflare token is added.
  deploy:
    name: Deploy
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.CF_DEPLOY == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: deploy
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run deploy

      # Prelum's prelum-indexnow with the live sitemap. Skipped while the site answers noindex (pre-launch), so it
      # starts on its own at launch. A refused ping is a warning, never a failed deploy.
      - name: Tell IndexNow
        run: |
          origin=$(sed -n 's/^  url: "\(.*\)",$/\1/p' app/config/site.ts)
          key=$(sed -n 's/^export const INDEXNOW_KEY = "\(.*\)";$/\1/p' app/config/site.ts)
          if curl -sfI "$origin/" | grep -qi '^x-robots-tag:.*noindex'; then echo "noindex: not sent"; exit 0; fi
          curl -sf "$origin/sitemap.xml" -o "$RUNNER_TEMP/sitemap.xml"
          npx prelum-indexnow --origin "$origin" --key "$key" --sitemap "$RUNNER_TEMP/sitemap.xml"
