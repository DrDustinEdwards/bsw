# Typecheck, build and a production audit on every pull request and on main, then a deploy from main.
# A run on main is never canceled, so a deploy cannot stop halfway.

name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ci:
    name: Typecheck, build, audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Raw console.* calls in server code may not rise above .console.json's baseline (devkit-console; the logger is
      # site-runtime ./log).
      - name: Console ratchet
        run: npm run --silent check:console

      - name: Build
        run: npm run build

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  # A merge to main deploys once CI is green. Dormant until the repo variable CF_DEPLOY is 'true' (with the secrets
  # CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID). devkit's shared deploy (worker-deploy.yml): it builds, uploads the
  # new version with DEPLOY_SHA set to this commit, gives it 10% of traffic for 10 minutes (gradual rollout, D4), waits
  # for /health to report it, checks the home page answers, then gives it all traffic, and rolls it back if it does not.
  # On a pull request from this repository it only uploads a preview version (pr-<number>, D6) and writes its URL to the
  # run summary; nothing is deployed.
  deploy:
    needs: ci
    if: >-
      vars.CF_DEPLOY == 'true' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'pull_request')
    concurrency:
      group: ${{ github.event_name == 'pull_request' && format('preview-{0}', github.ref) || 'deploy' }}
      cancel-in-progress: false
    uses: DrDustinEdwards/devkit/.github/workflows/worker-deploy.yml@db347b70932b52b427b120ee1419d4614d5e4c29 # v0.20.20
    with:
      worker-name: bsw
      health-url: https://bsw.dustin-edwards.workers.dev/health
      verify-command: >-
        code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 https://bsw.dustin-edwards.workers.dev/ || true);
        echo "home page answered $code";
        if [ "$code" = 200 ]; then exit 0; elif [ "$code" = 000 ]; then exit 3; else exit 1; fi
      pre-deploy: npm run build
      sha-var: DEPLOY_SHA
      gradual-percent: 10
      gradual-minutes: 10
      preview: true
      preview-build: npm run build
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  # Prelum's prelum-indexnow with the live sitemap, once the deploy is live. Skipped while the site answers noindex
  # (pre-launch), so it starts on its own at launch. A refused ping is a warning, never a failed deploy.
  indexnow:
    name: Tell IndexNow
    needs: deploy
    # Only after a deploy from main; a pull request's run uploads a preview and ships nothing.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Tell IndexNow
        run: |
          origin=$(sed -n 's/^  url: "\(.*\)",$/\1/p' app/config/site.ts)
          key=$(sed -n 's/^export const INDEXNOW_KEY = "\(.*\)";$/\1/p' app/config/site.ts)
          if curl -sfI "$origin/" | grep -qi '^x-robots-tag:.*noindex'; then echo "noindex: not sent"; exit 0; fi
          curl -sf "$origin/sitemap.xml" -o "$RUNNER_TEMP/sitemap.xml"
          npx prelum-indexnow --origin "$origin" --key "$key" --sitemap "$RUNNER_TEMP/sitemap.xml"
